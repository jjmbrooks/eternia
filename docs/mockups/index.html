<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block;width:390px;height:844px}</style></head><body><canvas id="c"></canvas><script>
const W=390,H=844,D=2,S=Math.min(W,H),EB=0.18*S;
const c=document.getElementById('c');c.width=W*D;c.height=H*D;const g=c.getContext('2d');g.scale(D,D);
let seed=7;const R=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const BANK={dis:['otra vez igual','no vas a poder','mejor ni lo intentes','ya debería haber terminado','qué van a pensar','no es suficiente'],
arm:['qué bien se siente esto','esto sí soy','que no se acabe','por fin estoy bien','merezco quedarme aquí','esto es lo que soy'],
amb:['por fin terminó','ojalá se quede','ya no importa','estaba mejor antes','qué raro se siente','no sé si quiero'],
neu:['el foco sigue prendido','mañana hay que salir','se me olvidó algo','qué hora será']};
const COL={dis:[226,58,52],arm:[236,190,92],amb:[170,150,230],neu:[150,170,185]};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
function bg(tint,amt){g.fillStyle='#030307';g.fillRect(0,0,W,H);
 let r=g.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,H*0.7);r.addColorStop(0,rgba(tint,amt));r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,W,H);}
function stain(x,y,rad,col,a,rough){g.save();g.filter='blur(18px)';for(let i=0;i<14;i++){const ox=x+(R()-.5)*rad*1.3,oy=y+(R()-.5)*rad*1.3,rr=rad*(.3+R()*.6);
 let r=g.createRadialGradient(ox,oy,0,ox,oy,rr);r.addColorStop(0,rgba(col,a*(.5+R()*.5)));r.addColorStop(1,rgba(col,0));g.fillStyle=r;g.beginPath();
 if(rough){for(let k=0;k<12;k++){const t=k/12*6.283,q=rr*(.5+R()*.6);g.lineTo(ox+Math.cos(t)*q,oy+Math.sin(t)*q)}}else g.arc(ox,oy,rr,0,7);g.fill();}g.restore();}
// edge band: vit 0..1 light, wide 0..1 width factor, focus bright
function edge(vit,wide,col=[150,200,230]){const w=EB*(.35+.65*wide);
 for(const [x0,y0,x1,y1,rx,ry,rw,rh] of [[0,0,w,0,0,0,w,H],[W,0,W-w,0,W-w,0,w,H],[0,0,0,w,0,0,W,w],[0,H,0,H-w,0,H-w,W,w]]){
  let l=g.createLinearGradient(x0,y0,x1,y1);l.addColorStop(0,rgba(col,.38*vit));l.addColorStop(.5,rgba(col,.10*vit));l.addColorStop(1,rgba(col,0));g.fillStyle=l;g.fillRect(rx,ry,rw,rh);}
 // breath line: rounded rect with sinusoidal amplitude
 const inset=w*.42,amp=1+7*vit*wide;g.save();g.shadowColor=rgba(col,.9);g.shadowBlur=12*vit+2;
 for(let L=0;L<3;L++){g.strokeStyle=rgba(col,(.08+.32*vit)/(L+1));g.lineWidth=L?0.6:1.1;g.beginPath();const per=2*(W+H);
  for(let s=0;s<=per;s+=2){let x,y,nx,ny;if(s<W){x=s;y=inset;nx=0;ny=1}else if(s<W+H){x=W-inset;y=s-W;nx=-1;ny=0}else if(s<2*W+H){x=W-(s-W-H);y=H-inset;nx=0;ny=-1}else{x=inset;y=H-(s-2*W-H);nx=1;ny=0}
   x=Math.min(Math.max(x,inset),W-inset);y=Math.min(Math.max(y,inset),H-inset);const o=Math.sin(s/38+L*1.7)*amp*(1-L*.3)+Math.sin(s/91)*amp*.5;s?g.lineTo(x+nx*o,y+ny*o):g.moveTo(x+nx*o,y+ny*o)}g.closePath();g.stroke();}
 g.restore();}
function phrase(t,x,y,fam,a,o={}){const legib=o.leg??1,size=o.size||15,dens=o.dens||0;let s=t.split('');
 if(legib<1)s=s.map(ch=>ch!==' '&&R()>legib?'\u00a0':ch);
 g.save();g.translate(x,y);g.rotate(o.rot||0);g.font=`${dens?500+dens*300:300} ${size}px "Cormorant Garamond","Georgia",serif`;g.textAlign='center';g.textBaseline='middle';
 const col=COL[fam];g.shadowColor=rgba(col,.9*a);g.shadowBlur=10+dens*16;
 if(fam==='amb'){const w=g.measureText(t).width;let l=g.createLinearGradient(-w/2,0,w/2,0);['#9fd8ff','#e7a2e8','#ffd38a','#9ff0d0'].forEach((cc,i)=>l.addColorStop(i/3,cc));g.fillStyle=l;g.globalAlpha=a;}
 else g.fillStyle=rgba(fam==='neu'?[180,195,205]:col.map(v=>Math.min(255,v+25)),a);
 if(fam==='dis'&&o.broken){// broken asymmetric: chars jitter, some cut
  let w=g.measureText(s.join('')).width,cx=-w/2;g.textAlign='left';for(const ch of s){const cw=g.measureText(ch).width;if(R()>.12){g.save();g.translate(cx,(R()-.5)*5);g.rotate((R()-.5)*.25);g.fillText(ch,0,0);g.restore()}cx+=cw*(1+(R()<.1?.6:0))}
 }else{g.fillText(s.join(''),0,0);if(dens){g.globalAlpha=a*.5;g.fillText(s.join(''),.6,.4)}}
 g.restore();}
function scatter(fam,n,a,o,avoid){for(let i=0;i<n;i++){const L=BANK[fam];const x=EB*.9+R()*(W-EB*1.8),y=EB+R()*(H-EB*2);phrase(L[i%L.length],x,y,fam,a*(.5+R()*.5),{...o,rot:o.rotr?(R()-.5)*o.rotr:0,size:(o.size||14)*(.8+R()*.4)})}}
function sphere(x,y,r,kind,col,def){g.save();
 // outer glow
 let gl=g.createRadialGradient(x,y,r*.5,x,y,r*3.2);gl.addColorStop(0,rgba(col,.35*def+.1));gl.addColorStop(1,rgba(col,0));g.fillStyle=gl;g.beginPath();g.arc(x,y,r*3.2,0,7);g.fill();
 g.beginPath();
 if(kind==='dis'){for(let k=0;k<46;k++){const t=k/46*6.283,q=r*(.82+R()*.32);g.lineTo(x+Math.cos(t)*q,y+Math.sin(t)*q)}}
 else if(kind==='arm'){for(let k=0;k<12;k++){const t=k/12*6.283-Math.PI/2;g.lineTo(x+Math.cos(t)*r,y+Math.sin(t)*r)}}
 else g.arc(x,y,r,0,7);g.closePath();
 let f=g.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);
 if(kind==='calm'){f.addColorStop(0,'rgba(235,240,255,.55)');f.addColorStop(.7,'rgba(170,190,230,.18)');f.addColorStop(1,'rgba(170,190,230,.05)')}
 else if(kind==='dis'){f.addColorStop(0,'rgba(255,120,90,1)');f.addColorStop(.45,'rgba(170,24,22,1)');f.addColorStop(1,'rgba(30,4,6,1)')}
 else if(kind==='arm'){f.addColorStop(0,'rgba(255,248,215,1)');f.addColorStop(.5,'rgba(232,180,80,1)');f.addColorStop(1,'rgba(130,85,20,1)')}
 else{f.addColorStop(0,rgba(col.map(v=>Math.min(255,v+90)),.95));f.addColorStop(.6,rgba(col,.8));f.addColorStop(1,rgba(col.map(v=>v*.4),.7))}
 g.shadowColor=rgba(col,.8);g.shadowBlur=20;g.fillStyle=f;g.fill();g.shadowBlur=0;
 g.save();g.clip();
 if(kind==='arm'){g.strokeStyle='rgba(255,245,210,.5)';g.lineWidth=.7;for(let k=0;k<12;k++){const t=k/12*6.283-Math.PI/2;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(t)*r,y+Math.sin(t)*r);g.stroke();
   g.beginPath();g.moveTo(x+Math.cos(t)*r*.55,y+Math.sin(t)*r*.55);const t2=t+6.283/12;g.lineTo(x+Math.cos(t2)*r*.55,y+Math.sin(t2)*r*.55);g.stroke();}}
 if(kind==='dis'){for(let i=0;i<40;i++){g.fillStyle=`rgba(0,0,0,${.15+R()*.35})`;g.beginPath();const px=x+(R()-.5)*2*r,py=y+(R()-.5)*2*r;g.moveTo(px,py);g.lineTo(px+(R()-.5)*r*.5,py+(R()-.5)*r*.5);g.lineTo(px+(R()-.5)*r*.4,py+(R()-.5)*r*.4);g.fill()}
   g.strokeStyle='rgba(255,160,130,.35)';g.lineWidth=.6;for(let i=0;i<8;i++){g.beginPath();let px=x+(R()-.5)*r,py=y+(R()-.5)*r;g.moveTo(px,py);for(let j=0;j<4;j++){px+=(R()-.5)*r*.5;py+=(R()-.5)*r*.5;g.lineTo(px,py)}g.stroke()}}
 if(kind==='mottled'){const cs=[[226,58,52],[236,190,92],[150,200,255],[220,140,230]];g.filter='blur(3px)';for(let i=0;i<26;i++){const cc=cs[i%4];g.fillStyle=rgba(cc,.55);g.beginPath();g.arc(x+(R()-.5)*1.8*r,y+(R()-.5)*1.8*r,r*(.12+R()*.22),0,7);g.fill()}g.filter='none'}
 if(kind==='bleed'){g.filter='blur(4px)';let b=g.createRadialGradient(x+r*.6,y+r*.5,0,x+r*.6,y+r*.5,r*1.2);b.addColorStop(0,'rgba(230,40,35,.95)');b.addColorStop(1,'rgba(230,40,35,0)');g.fillStyle=b;g.fillRect(x-r,y-r,2*r,2*r);g.filter='none'}
 if(kind==='thin'){g.globalCompositeOperation='destination-out';g.filter='blur(2px)';for(let i=0;i<14;i++){g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.arc(x+(R()-.5)*2*r,y+(R()-.5)*2*r,r*.2,0,7);g.fill()}g.filter='none'}
 g.restore();
 // spec highlight
 let h=g.createRadialGradient(x-r*.4,y-r*.45,0,x-r*.4,y-r*.45,r*.5);h.addColorStop(0,'rgba(255,255,255,.55)');h.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=h;g.beginPath();g.arc(x-r*.4,y-r*.45,r*.5,0,7);g.fill();
 g.restore();}
function halo(x,y,r=34,a=.35){let h=g.createRadialGradient(x,y,0,x,y,r);h.addColorStop(0,`rgba(255,255,255,${a*.25})`);h.addColorStop(.55,`rgba(255,255,255,${a*.12})`);h.addColorStop(.8,`rgba(255,255,255,${a*.3})`);h.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=h;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function trail(pts,col,a){g.save();g.strokeStyle=rgba(col,a);g.lineWidth=.8;g.setLineDash([1,5]);g.beginPath();pts.forEach((p,i)=>i?g.quadraticCurveTo(...p):g.moveTo(...p));g.stroke();g.restore();}
function motes(n,col,a){for(let i=0;i<n;i++){g.fillStyle=rgba(col,a*R());g.beginPath();g.arc(R()*W,R()*H,R()*1.3,0,7);g.fill()}}
function grain(amt){const id=g.getImageData(0,0,W*D,H*D),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0);
 // vignette
 g.setTransform(D,0,0,D,0,0);let v=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');g.fillStyle=v;g.fillRect(0,0,W,H);}
const F={
apertura(){bg([60,70,110],.18);motes(80,[180,190,230],.5);edge(.55,.6);scatter('neu',2,.22,{leg:.45,size:13});scatter('amb',1,.2,{leg:.4,size:13});scatter('arm',1,.18,{leg:.4,size:13});
 sphere(W/2,H*.56,.22*.25*S*.55+8,'calm',[190,200,240],.3);
 g.save();g.font='300 44px "Cormorant Garamond",Georgia,serif';g.textAlign='center';g.fillStyle='rgba(235,232,255,.62)';g.shadowColor='rgba(190,200,255,.8)';g.shadowBlur=24;g.letterSpacing='14px';g.fillText('Eternia',W/2+7,H*.37);g.restore();},
calma(){bg([50,80,120],.16);motes(90,[170,200,230],.5);edge(.7,.75);sphere(W*.46,H*.52,.05*S,'calm',[190,205,240],.2);
 phrase('se me olvidó algo',W*.34,H*.3,'neu',.33,{leg:.55,size:14});phrase('qué raro se siente',W*.64,H*.66,'amb',.3,{leg:.5,size:14});phrase('otra vez igual',W*.62,H*.41,'dis',.26,{leg:.45,size:13});phrase('por fin estoy bien',W*.4,H*.77,'arm',.24,{leg:.4,size:13});},
fusion(){bg([90,20,25],.22);stain(W*.7,H*.34,110,[150,20,25],.22,true);stain(W*.3,H*.66,60,[110,10,15],.14,true);motes(70,[230,120,110],.4);edge(.45,.5);
 const sx=W*.47,sy=H*.5;phrase('no vas a poder',W*.73,H*.27,'dis',.55,{broken:1,size:15});phrase('otra vez igual',W*.26,H*.36,'dis',.5,{broken:1});phrase('no es suficiente',W*.7,H*.72,'dis',.5,{broken:1});
 trail([[W*.73,H*.29],[W*.62,H*.36,sx+20,sy-25]],[230,60,50],.5);trail([[W*.26,H*.38],[W*.3,H*.46,sx-22,sy-8]],[230,60,50],.4);trail([[W*.7,H*.7],[W*.62,H*.6,sx+15,sy+22]],[230,60,50],.4);
 phrase('qué hora será',W*.32,H*.8,'neu',.2,{leg:.8,size:13});phrase('que no se acabe',W*.3,H*.22,'arm',.16,{size:13});
 sphere(sx,sy,.07*S,'bleed',[210,170,175],.55);halo(sx,sy,44,.6);phrase('ya debería haber terminado',W*.5,sy+34,'dis',.95,{dens:.9,size:19});},
disonante(){bg([120,10,15],.3);stain(W*.5,H*.45,170,[150,15,20],.22,true);stain(W*.2,H*.2,80,[90,5,10],.22,true);stain(W*.8,H*.8,100,[120,8,12],.22,true);motes(160,[255,90,70],.5);edge(.12,.2,[200,120,110]);
 for(let i=0;i<18;i++){const L=BANK.dis,x=EB*.5+R()*(W-EB),y=EB*.6+R()*(H-EB*1.2);if(Math.hypot(x-W*.55,y-H*.48)<60)continue;phrase(L[i%6],x,y,'dis',.5+R()*.5,{broken:1,size:13+R()*7,rot:(R()-.5)*.5})}
 phrase('se me olvidó algo',W*.3,H*.84,'neu',.1,{size:12});phrase('qué bien se siente esto',W*.65,H*.12,'arm',.08,{size:12});
 sphere(W*.55,H*.48,.11*S,'dis',[220,40,35],1);halo(W*.55,H*.48,62,.35);},
cristal(){bg([110,80,20],.3);g.save();g.translate(W/2,H*.47);g.strokeStyle='rgba(240,200,110,.06)';for(let k=0;k<24;k++){g.rotate(Math.PI/12);g.beginPath();g.moveTo(0,0);g.lineTo(0,H);g.stroke()}g.restore();
 motes(120,[255,220,140],.5);edge(.14,.2,[220,200,150]);
 const L=BANK.arm;const pos=[[.5,.17],[.5,.78],[.25,.3],[.75,.3],[.25,.65],[.75,.65],[.2,.47],[.8,.47],[.32,.22],[.68,.22],[.32,.72],[.68,.72],[.5,.88],[.5,.08]];
 pos.forEach((p,i)=>phrase(L[i%6],W*p[0],H*p[1],'arm',.55+.35*(i<6),{size:14+(i<6?3:0)}));
 phrase('mejor ni lo intentes',W*.28,H*.56,'dis',.07,{size:12});phrase('ya no importa',W*.72,H*.4,'amb',.07,{size:12});phrase('qué hora será',W*.6,H*.93,'neu',.06,{size:12});
 sphere(W/2,H*.47,.11*S,'arm',[240,190,90],1);halo(W/2,H*.47,62,.3);},
ambigua(){bg([70,50,110],.22);stain(W*.55,H*.5,110,[130,90,170],.25,false);motes(110,[200,180,255],.5);edge(.45,.55);
 scatter('amb',3,.45,{size:14});phrase('no vas a poder',W*.3,H*.25,'dis',.35,{broken:1});phrase('esto sí soy',W*.72,H*.75,'arm',.35);phrase('qué van a pensar',W*.7,H*.2,'dis',.3,{broken:1});phrase('por fin estoy bien',W*.28,H*.8,'arm',.3);
 phrase('ojalá se quede',W*.5,H*.49+30,'amb',.95,{dens:.6,size:18});sphere(W*.5,H*.49,.075*S,'mottled',[200,170,220],.6);halo(W*.5,H*.49,46,.5);},
guia(){F.disonante();seed=99;// guide light at right edge

 let v=g.createLinearGradient(0,gy-150,0,gy+150);v.addColorStop(0,'rgba(220,240,255,0)');v.addColorStop(.5,'rgba(235,245,255,.9)');v.addColorStop(1,'rgba(220,240,255,0)');g.fillStyle=v;g.filter='blur(2px)';g.fillRect(gx-1.5,gy-150,3,300);g.restore();
 g.save();g.font='italic 300 13px "Cormorant Garamond",Georgia,serif';g.textAlign='right';g.fillStyle='rgba(225,240,255,.85)';g.shadowColor='rgba(170,210,255,.9)';g.shadowBlur=8;g.fillText('Esto te rebasó.',gx-16,gy-6);g.fillText('No tienes que seguirlo.',gx-16,gy+12);g.restore();},
aire(){bg([40,80,110],.15);stain(W*.55,H*.45,90,[120,40,40],.12,false);motes(120,[170,220,240],.6);edge(1,1,[170,225,245]);
 phrase('ya debería haber terminado',W*.48,H*.38,'dis',.25,{leg:.7,size:14});phrase('qué bien se siente esto',W*.56,H*.62,'arm',.2,{leg:.6,size:13});phrase('el foco sigue prendido',W*.44,H*.72,'neu',.2,{leg:.6,size:13});
 g.globalAlpha=.55;sphere(W*.52,H*.5,.055*S,'calm',[200,170,170],.2);g.globalAlpha=1;halo(EB*.4,H*.47,40,.7);},
centro(){bg([30,40,70],.2);motes(60,[220,220,255],.35);edge(.85,.9,[190,210,240]);const cx=W/2,cy=H*.48;
 [[5,150,95,.2],[7,120,170,1.1],[4,175,130,2.3]].forEach(([n,a,b,r],i)=>{g.save();g.translate(cx,cy);g.rotate(r);g.strokeStyle=['rgba(226,90,80,.14)','rgba(236,190,92,.14)','rgba(170,160,240,.16)'][i];g.lineWidth=1;g.beginPath();g.ellipse(0,0,a,b,0,0,7);g.stroke();
  for(let k=0;k<n;k++){const t=k/n*6.283;g.fillStyle=g.strokeStyle.replace(/[\d.]+\)$/,'.6)');g.beginPath();g.arc(Math.cos(t)*a,Math.sin(t)*b,1.8,0,7);g.fill()}g.restore()});
 const cols=[COL.dis,COL.arm,[150,200,255],[220,150,230],[140,220,200]];g.save();g.globalCompositeOperation='lighter';
 for(let i=1;i<520;i++){const ang=i*137.5*Math.PI/180,rr=6.4*Math.sqrt(i),x=cx+Math.cos(ang)*rr,y=cy+Math.sin(ang)*rr;if(rr>165)break;const col=cols[Math.floor(R()*5)];const sz=.6+1.6*(1-rr/170);if(i%2)continue;
  let p=g.createRadialGradient(x,y,0,x,y,sz*3);p.addColorStop(0,rgba(col,.55));p.addColorStop(1,rgba(col,0));g.fillStyle=p;g.beginPath();g.arc(x,y,sz*3,0,7);g.fill()}g.restore();}
};
const name=new URLSearchParams(location.search).get('f')||'apertura';F[name]();grain(22);document.title='done';
